<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Backstitch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Backstitch">
<meta name="theme-color" content="#FAF6EF">
<link id="favicon" rel="icon" href="data:,">
<link id="appleicon" rel="apple-touch-icon" href="data:,">
<style>
  :root{
    --paper:#FAF6EF; --paper2:#F3ECE0; --card:#FFFFFF;
    --ink:#2E2620; --ink-soft:#6B5F52; --line:#E4D9C8; --line-soft:#EFE7DA;
    --berry:#9B3B5E; --berry-deep:#7C2E4B; --sage:#5F7D5A; --ochre:#C0862B; --rust:#B04A2F;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    --radius:14px; --shadow:0 1px 0 rgba(46,38,32,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);font-size:16px;line-height:1.4;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:16px;}

  header{background:var(--paper);padding:calc(env(safe-area-inset-top) + 14px) 20px 0;position:sticky;top:0;z-index:40;}
  .brandrow{display:flex;align-items:center;gap:12px;}
  .mark{width:38px;height:38px;border-radius:10px;flex:none;background:var(--berry);display:flex;align-items:center;justify-content:center;}
  .mark svg{width:24px;height:24px;}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:.3px;}
  .brand .sub{font-size:12px;color:var(--ink-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
  .gear{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--ink-soft);}

  nav{display:flex;gap:4px;overflow-x:auto;padding:14px 20px 0;background:var(--paper);position:sticky;top:calc(env(safe-area-inset-top) + 62px);z-index:39;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--line);}
  nav::-webkit-scrollbar{display:none;}
  .tab{border:none;background:none;color:var(--ink-soft);padding:8px 14px 14px;font-size:15px;font-weight:500;white-space:nowrap;position:relative;border-radius:8px 8px 0 0;}
  .tab.active{color:var(--berry-deep);font-weight:600;}
  .tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:0;border-bottom:3px dashed var(--berry);}

  main{padding:20px 20px 60px;max-width:1000px;margin:0 auto;}

  .subtabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper2);padding:5px;border-radius:12px;}
  .subtab{flex:1;border:none;background:none;padding:10px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink-soft);}
  .subtab.active{background:#fff;color:var(--berry-deep);box-shadow:var(--shadow);}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px;}
  .tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px;}
  .tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);text-align:left;padding:9px 12px;background:var(--paper2);border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tbl tr.tap{cursor:pointer;} .tbl tr.tap:active{background:var(--paper2);}
  .chk{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:#fff;}
  .chk.on{background:var(--sage);border-color:var(--sage);}
  .dots{border:none;background:none;font-size:22px;color:var(--ink-soft);padding:0 4px;line-height:1;}

  .homegrid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:8px;}
  @media(min-width:720px){.homegrid{grid-template-columns:1fr 1fr;}}
  .homecol h3{font-family:var(--serif);font-size:18px;margin:0 0 10px;font-weight:600;}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;}
  .tile{border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 18px;background:#fff;position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;}
  .tile.pending{background:#fdf7ea;} .tile.pending::before{background:var(--ochre);}
  .tile.completed{background:#eef4ec;} .tile.completed::before{background:var(--sage);}
  .tile.cancelled{background:#f9ede9;} .tile.cancelled::before{background:var(--rust);}
  .tile .st{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .tile.pending .st{color:var(--ochre);} .tile.completed .st{color:var(--sage);} .tile.cancelled .st{color:var(--rust);}
  .tile .cust{font-weight:600;font-size:16px;padding-right:56px;}
  .tile .its{font-size:12px;color:var(--ink-soft);margin:5px 0;}
  .tile .tot{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;}

  .viewhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .viewhead h2{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;}
  .viewhead p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}

  .btn{border:1px solid var(--berry);background:var(--berry);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;font-weight:600;}
  .btn:active{background:var(--berry-deep);}
  .btn.ghost{background:#fff;color:var(--berry-deep);}
  .btn.small{padding:7px 12px;font-size:14px;}
  .btn.wide{width:100%;justify-content:center;}
  .btn.neutral{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn.danger{background:#fff;color:var(--rust);border-color:var(--rust);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .note{font-size:13px;color:var(--ink-soft);line-height:1.6;}

  .section-label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 10px;display:flex;align-items:center;gap:10px;}
  .section-label::after{content:"";flex:1;border-bottom:2px dashed var(--line);}

  .empty{text-align:center;color:var(--ink-soft);padding:30px 16px;border:2px dashed var(--line);border-radius:var(--radius);background:#fffdf9;}
  .empty .big{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:4px;}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;top:10px;right:12px;width:14px;height:14px;border-radius:50%;border:2px dashed var(--line);}
  .stat .k{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;}
  .stat .v{font-family:var(--serif);font-size:24px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;}

  .overlay{position:fixed;inset:0;background:rgba(46,38,32,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  @media(min-width:620px){.overlay{align-items:center;padding:20px;}}
  .modal{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(20px);transition:transform .2s;-webkit-overflow-scrolling:touch;}
  @media(min-width:620px){.modal{border-radius:20px;}}
  .overlay.show .modal{transform:translateY(0);}
  .modal h3{font-family:var(--serif);font-size:22px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--berry);outline-offset:-1px;}
  .field.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field.two label{grid-column:1/-1;margin-bottom:0;}
  .modal-actions{display:flex;gap:10px;margin-top:8px;}
  .modal-actions .btn{flex:1;justify-content:center;text-align:center;}

  .lineitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 56px 78px 30px;gap:8px;align-items:center;}
  .lineitem select,.lineitem input{padding:9px;border:1px solid var(--line);border-radius:9px;width:100%;}
  .lineitem .rm{border:none;background:none;color:var(--rust);font-size:20px;padding:0;}
  .li-head{display:grid;grid-template-columns:1fr 56px 78px 30px;gap:8px;font-size:11px;color:var(--ink-soft);padding:0 10px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}

  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px;}
  .kv:last-child{border-bottom:none;}
  .kv .amt{font-weight:600;}

  .ledgerrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .ledgerrow .desc{font-size:15px;font-weight:500;}
  .ledgerrow .date{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .ledgerrow .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  details.help summary{font-weight:600;color:var(--berry-deep);cursor:pointer;padding:6px 0;}
  details.help ol{margin:6px 0 0;padding-left:20px;line-height:1.7;font-size:14px;color:var(--ink-soft);}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M3 8 L8 12 L3 16" stroke-dasharray="1 3"/>
        <path d="M6 12 L21 12" stroke-dasharray="3 3"/>
        <circle cx="18" cy="12" r="3.2" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <div class="brand"><h1>Backstitch</h1><div class="sub">Studio Ledger</div></div>
    <button class="gear" onclick="openBackup()" aria-label="Backup and settings">⚙︎</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============ STORAGE ============ */
const KEY="backstitch_db_v2";
const OLD_KEY="backstitch_db_v1";
const CATS=["animals","keychains","flowers","misc"];
const catLabel=c=>({animals:"Animals",keychains:"Keychains",flowers:"Flowers",misc:"Misc"}[c]||"Misc");
const blank={products:[],purchases:[],expenses:[],orders:[],meta:{lowStock:3,lastBackup:null}};
let db=load();

function migrate(d){
  d.products=d.products||[]; d.purchases=d.purchases||[]; d.expenses=d.expenses||[]; d.orders=d.orders||[];
  if(!d.meta) d.meta=structuredClone(blank.meta);
  if(d.meta.lowStock==null) d.meta.lowStock=3;
  d.products.forEach(p=>{
    const raw=(p.category||"").toLowerCase();
    if(raw.includes("animal")) p.category="animals";
    else if(raw.includes("key")) p.category="keychains";
    else if(raw.includes("flower")) p.category="flowers";
    else if(!CATS.includes(p.category)) p.category="misc";
    if(p.cost==null) p.cost=0; if(p.price==null) p.price=0;
  });
  d.purchases=d.purchases.map(pu=>{
    if(pu && pu.items){ if(pu.shipping==null) pu.shipping=0; return pu; }
    if(pu && pu.productId!=null) return {id:pu.id||uid(),date:pu.date||today(),items:[{productId:pu.productId,qty:pu.qty,unitCost:pu.unitCost}],shipping:0};
    return pu;
  }).filter(Boolean);
  d.orders.forEach(o=>{
    if(o.status==="delivered") o.status="completed";
    if(o.status!=="completed"&&o.status!=="pending"&&o.status!=="cancelled") o.status="pending";
    if(o.discountType==null){
      if(o.discount){ o.discountType="flat"; o.discountValue=o.discount; }
      else { o.discountType="none"; o.discountValue=0; }
    }
    if(o.customer==null){
      const c=(d.customers||[]).find(x=>x.id===o.customerId);
      o.customer=c?c.name:"";
      if(o.contact==null) o.contact=c?(c.phone||c.instagram||""):"";
    }
    o.items=o.items||[];
  });
  delete d.customers; delete d.offers;
  return d;
}
function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw){ const old=localStorage.getItem(OLD_KEY); if(old) raw=old; }
    if(!raw) return structuredClone(blank);
    return migrate(JSON.parse(raw));
  }catch(e){ console.error(e); return structuredClone(blank); }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){ alert("Could not save — storage may be full or blocked. Please export a backup."); } }
const uid=()=>(Date.now().toString(36)+Math.random().toString(36).slice(2,7));

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
const fmtShort=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";
const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):"";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900); }
function productName(id){ const p=db.products.find(x=>x.id===id); return p?p.name:"(removed)"; }

/* ============ CALCS ============ */
function purchasedQty(pid){ let q=0; for(const t of db.purchases) for(const it of (t.items||[])) if(it.productId===pid) q+=Number(it.qty)||0; return q; }
function orderedQty(pid){ let q=0; for(const o of db.orders){ if(o.status==="cancelled") continue; for(const it of (o.items||[])) if(it.productId===pid) q+=Number(it.qty)||0; } return q; }
function availableQty(pid){ return purchasedQty(pid)-orderedQty(pid); }

function orderSubtotal(o){ return (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0); }
function orderDiscount(o){ const sub=orderSubtotal(o); if(o.discountType==="percent") return Math.round(sub*(Number(o.discountValue)||0)/100); if(o.discountType==="flat") return Number(o.discountValue)||0; return 0; }
function orderTotal(o){ return Math.max(0,orderSubtotal(o)-orderDiscount(o)); }
function purchaseAmount(t){ return (t.items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.unitCost)||0),0)+(Number(t.shipping)||0); }

function totals(){
  let spend=0; for(const t of db.purchases) spend+=purchaseAmount(t); for(const e of db.expenses) spend+=Number(e.amount)||0;
  let received=0,pending=0;
  for(const o of db.orders){ if(o.status==="completed") received+=orderTotal(o); else if(o.status==="pending") pending+=orderTotal(o); }
  return {spend,received,pending,balance:received-spend};
}

/* ============ NAV ============ */
const TABS=[["home","Home"],["inventory","Inventory"],["expense","Expense"],["orders","Orders"],["ledger","Ledger"]];
let current="home";
function renderNav(){ $("#nav").innerHTML=TABS.map(([id,l])=>`<button class="tab ${id===current?'active':''}" onclick="go('${id}')">${l}</button>`).join(""); }
function go(id){ current=id; renderNav(); render(); window.scrollTo(0,0); }
function render(){ ({home:vHome,inventory:vInventory,expense:vExpense,orders:vOrders,ledger:vLedger}[current])(); }
function head(t,s,btn){ return `<div class="viewhead"><div><h2>${t}</h2>${s?`<p>${s}</p>`:""}</div>${btn||""}</div>`; }
function emptyState(msg,cta){ return `<div class="empty"><div class="big">Nothing here yet</div><div>${msg}</div>${cta?`<div style="margin-top:14px">${cta}</div>`:""}</div>`; }

/* ============ HOME ============ */
function vHome(){
  const t=totals();
  let h=head("Home","Your studio at a glance");
  h+=`<div class="stats">
    <div class="stat"><div class="k">Total spendings</div><div class="v neg">${money(t.spend)}</div></div>
    <div class="stat"><div class="k">Income received</div><div class="v pos">${money(t.received)}</div></div>
    <div class="stat"><div class="k">Pending income</div><div class="v">${money(t.pending)}</div></div>
    <div class="stat"><div class="k">Balance</div><div class="v ${t.balance>=0?'pos':'neg'}">${money(t.balance)}</div></div>
  </div>`;

  h+=`<div class="homegrid">`;

  h+=`<div class="homecol"><h3>Orders</h3>`;
  const ords=db.orders.filter(o=>o.status!=="cancelled").sort((a,b)=>{
    if((a.status==="pending")!==(b.status==="pending")) return a.status==="pending"?-1:1;
    return (b.date||"").localeCompare(a.date||"");
  });
  if(!ords.length) h+=`<div class="card note">No orders yet. Add one in the Orders tab.</div>`;
  else{
    h+=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Customer</th><th class="num">Total</th><th>Done</th></tr></thead><tbody>`;
    h+=ords.map(o=>{
      const items=(o.items||[]).map(it=>esc(productName(it.productId))+"×"+it.qty).join(", ");
      const done=o.status==="completed";
      return `<tr><td>${esc(o.customer||"Customer")}<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">${items||"—"}</div></td>
        <td class="num">${money(orderTotal(o))}</td>
        <td><button class="chk ${done?"on":""}" onclick="toggleComplete('${o.id}')">${done?"✓":""}</button></td></tr>`;
    }).join("");
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;

  h+=`<div class="homecol"><h3>Inventory</h3>`;
  if(!db.products.length) h+=`<div class="card note">Add products in the Inventory tab.</div>`;
  else{
    const rows=[...db.products].map(p=>({p,a:availableQty(p.id)})).sort((x,y)=>x.a-y.a);
    h+=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Product</th><th class="num">Left</th></tr></thead><tbody>`;
    h+=rows.map(({p,a})=>`<tr><td>${esc(p.name)}</td><td class="num ${a<0?'neg':''}"><b>${a}</b></td></tr>`).join("");
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;

  h+=`</div>`;
  $("#view").innerHTML=h;
}
function toggleComplete(id){ const o=db.orders.find(x=>x.id===id); if(!o)return; if(o.status==="completed"){ o.status="pending"; delete o.completedDate; } else { o.status="completed"; o.completedDate=today(); } save(); toast(o.status==="completed"?"Completed — added to ledger":"Set back to pending"); render(); }

/* ============ INVENTORY ============ */
function vInventory(){
  const btn=`<button class="btn" onclick="openProduct()">＋ Add product</button>`;
  let h=head("Inventory","Tap a row to edit · available = stock in − orders",btn);
  if(!db.products.length){ $("#view").innerHTML=h+emptyState("Add your products with buying and selling price.",`<button class="btn" onclick="openProduct()">＋ Add product</button>`); return; }
  CATS.forEach(cat=>{
    const list=db.products.filter(p=>p.category===cat).sort((a,b)=>a.name.localeCompare(b.name));
    if(!list.length) return;
    h+=`<div class="section-label">${catLabel(cat)}</div>`;
    h+=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Name</th><th class="num">Buying</th><th class="num">Selling</th><th class="num">Left</th></tr></thead><tbody>`;
    h+=list.map(p=>{
      const a=availableQty(p.id);
      return `<tr class="tap" onclick="openProduct('${p.id}')"><td>${esc(p.name)}</td><td class="num">${money(p.cost)}</td><td class="num">${money(p.price)}</td><td class="num ${a<0?'neg':''}"><b>${a}</b></td></tr>`;
    }).join("");
    h+=`</tbody></table></div>`;
  });
  $("#view").innerHTML=h;
}
function openProduct(id){
  const p=id?db.products.find(x=>x.id===id):null;
  const d=p||{category:"animals"};
  let inner=`<h3>${id?"Edit":"Add"} product</h3>`;
  inner+=`<div class="field"><label>Name</label><input id="p_name" value="${esc(d.name||"")}" placeholder="Bunny Blue"></div>`;
  inner+=`<div class="field"><label>Category</label><select id="p_cat">${CATS.map(c=>`<option value="${c}" ${d.category===c?"selected":""}>${catLabel(c)}</option>`).join("")}</select></div>`;
  inner+=`<div class="field two"><label>Prices ₹</label>
    <input id="p_cost" type="number" inputmode="decimal" value="${esc(d.cost!=null?d.cost:"")}" placeholder="Buying">
    <input id="p_price" type="number" inputmode="decimal" value="${esc(d.price!=null?d.price:"")}" placeholder="Selling"></div>`;
  inner+=`<div class="modal-actions">`;
  if(id) inner+=`<button class="btn danger" onclick="delProduct('${id}')">Delete</button>`;
  inner+=`<button class="btn neutral" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveProduct('${id||""}')">${id?"Save":"Add"}</button></div>`;
  showModal(inner);
}
function saveProduct(id){
  const name=$("#p_name").value.trim(); if(!name){ toast("Please enter a name"); return; }
  const rec=id?db.products.find(x=>x.id===id):{id:uid()};
  rec.name=name; rec.category=$("#p_cat").value;
  rec.cost=$("#p_cost").value===""?0:Number($("#p_cost").value);
  rec.price=$("#p_price").value===""?0:Number($("#p_price").value);
  if(!id) db.products.push(rec);
  save(); closeModal(); toast(id?"Saved":"Product added"); render();
}
function delProduct(id){ if(!confirm("Delete this product?")) return; db.products=db.products.filter(x=>x.id!==id); save(); closeModal(); toast("Deleted"); render(); }

/* ============ EXPENSE ============ */
function vExpense(){
  const btn=`<button class="btn" onclick="openSpend()">＋ New purchase</button>`;
  let h=head("Expense","Stock purchases and other costs",btn);
  const entries=[];
  db.purchases.forEach(t=>entries.push({type:"purchase",id:t.id,date:t.date,amount:purchaseAmount(t),cat:"Stock",
    note:((t.items||[]).map(it=>productName(it.productId)+"×"+it.qty).join(", ")||"—")+(Number(t.shipping)?` (+${money(t.shipping)} ship)`:"")}));
  db.expenses.forEach(e=>entries.push({type:"expense",id:e.id,date:e.date,amount:Number(e.amount)||0,cat:e.category?cap(e.category):"Other",note:e.notes||"—"}));
  if(!entries.length){ $("#view").innerHTML=h+emptyState("Record a stock purchase or another cost.",`<button class="btn" onclick="openSpend()">＋ New purchase</button>`); return; }
  entries.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  h+=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Cost</th><th></th></tr></thead><tbody>`;
  h+=entries.map(e=>`<tr><td>${fmtShort(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.note)}</td><td class="num">${money(e.amount)}</td>
    <td><button class="dots" onclick="expenseMenu('${e.type}','${e.id}')">⋯</button></td></tr>`).join("");
  h+=`</tbody></table></div>`;
  $("#view").innerHTML=h;
}
function expenseMenu(type,id){
  actionSheet("Entry options",[
    {label:"Edit",fn:()=> type==="purchase"?editPurchase(id):editOther(id)},
    {label:"Delete",danger:true,fn:()=> type==="purchase"?delPurchase(id):delOther(id)}
  ]);
}

let spendMode="products", spendEditId=null, purDraft=null, otherDraft=null;
function openSpend(){
  spendMode="products"; spendEditId=null;
  purDraft={date:today(),items:[{productId:"",qty:1,unitCost:""}],shipping:""};
  otherDraft={date:today(),category:"packaging",amount:"",notes:""};
  renderSpend(true);
}
function editPurchase(id){ const t=db.purchases.find(x=>x.id===id); if(!t)return; spendMode="products"; spendEditId=id; purDraft=structuredClone(t); if(!purDraft.items||!purDraft.items.length) purDraft.items=[{productId:"",qty:1,unitCost:""}]; if(purDraft.shipping==null) purDraft.shipping=""; renderSpend(false); }
function editOther(id){ const e=db.expenses.find(x=>x.id===id); if(!e)return; spendMode="other"; spendEditId=id; otherDraft=structuredClone(e); renderSpend(false); }
function switchSpend(m){ if(spendMode==="products") puSync(); else otherSync(); spendMode=m; renderSpend(true); }
function renderSpend(showToggle){
  let inner=`<h3>${spendEditId?"Edit":"New"} ${spendMode==="products"?"stock purchase":"expense"}</h3>`;
  if(showToggle) inner+=`<div class="subtabs">
    <button class="subtab ${spendMode==="products"?"active":""}" onclick="switchSpend('products')">Products</button>
    <button class="subtab ${spendMode==="other"?"active":""}" onclick="switchSpend('other')">Other</button></div>`;
  inner+= spendMode==="products"? puForm() : otherForm();
  showModal(inner);
}
function puForm(){
  let h=`<div class="field"><label>Date</label><input id="pu_date" type="date" value="${esc(purDraft.date)}"></div>`;
  h+=`<label style="font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block">Products bought</label>`;
  h+=`<div class="li-head"><span>Product</span><span>Qty</span><span>Cost ₹</span><span></span></div>`;
  h+=`<div id="pu_items">`+purDraft.items.map((it,i)=>puLine(it,i)).join("")+`</div>`;
  h+=`<button class="btn ghost small" onclick="puAdd()" style="margin:2px 0 14px">＋ Add product</button>`;
  h+=`<div class="field"><label>Shipping charge ₹ (optional)</label><input id="pu_ship" type="number" inputmode="decimal" value="${esc(purDraft.shipping||"")}" placeholder="0" onchange="puTotals()"></div>`;
  h+=`<div id="pu_total" class="kv" style="font-size:17px"><span>Total spend</span><span class="amt">${money(puTotal())}</span></div>`;
  h+=`<div class="modal-actions" style="margin-top:14px"><button class="btn neutral" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePurchase()">${spendEditId?"Save":"Record purchase"}</button></div>`;
  return h;
}
function puLine(it,i){
  const opts=`<option value="">Product…</option>`+db.products.map(p=>`<option value="${p.id}" ${it.productId===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
  return `<div class="lineitem">
    <select onchange="puChange(${i},'productId',this.value)">${opts}</select>
    <input type="number" inputmode="numeric" value="${esc(it.qty)}" onchange="puChange(${i},'qty',this.value)">
    <input type="number" inputmode="decimal" value="${esc(it.unitCost)}" onchange="puChange(${i},'unitCost',this.value)">
    <button class="rm" onclick="puRm(${i})">×</button></div>`;
}
function puSync(){ if($("#pu_date")) purDraft.date=$("#pu_date").value; if($("#pu_ship")) purDraft.shipping=$("#pu_ship").value===""?"":Number($("#pu_ship").value); }
function puChange(i,k,val){
  if(k==="productId"){
    purDraft.items[i].productId=val;
    const p=db.products.find(x=>x.id===val);
    if(p && (purDraft.items[i].unitCost===""||purDraft.items[i].unitCost==null)) purDraft.items[i].unitCost=p.cost;
    puSync(); $("#pu_items").innerHTML=purDraft.items.map((it,idx)=>puLine(it,idx)).join("");
  } else purDraft.items[i][k]= val===""?"":Number(val);
  puTotals();
}
function puTotals(){ puSync(); if($("#pu_total")) $("#pu_total").innerHTML=`<span>Total spend</span><span class="amt">${money(puTotal())}</span>`; }
function puAdd(){ puSync(); purDraft.items.push({productId:"",qty:1,unitCost:""}); $("#pu_items").innerHTML=purDraft.items.map((it,i)=>puLine(it,i)).join(""); }
function puRm(i){ puSync(); purDraft.items.splice(i,1); if(!purDraft.items.length) purDraft.items.push({productId:"",qty:1,unitCost:""}); renderSpend(!spendEditId); }
function puTotal(){ return (purDraft.items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.unitCost)||0),0)+(Number(purDraft.shipping)||0); }
function savePurchase(){
  puSync();
  const items=purDraft.items.filter(it=>it.productId).map(it=>({productId:it.productId,qty:Number(it.qty)||0,unitCost:it.unitCost===""?0:Number(it.unitCost)}));
  if(!items.length){ toast("Add at least one product"); return; }
  const rec=spendEditId?db.purchases.find(x=>x.id===spendEditId):{id:uid()};
  rec.date=purDraft.date; rec.items=items; rec.shipping=purDraft.shipping===""?0:Number(purDraft.shipping);
  if(!spendEditId) db.purchases.push(rec);
  save(); closeModal(); toast(spendEditId?"Saved":"Purchase recorded — stock updated"); render();
}

const OTHER_CATS=["packaging","travel","shipping","ads","misc"];
function otherForm(){
  let h=`<div class="field"><label>Date</label><input id="ot_date" type="date" value="${esc(otherDraft.date)}"></div>`;
  h+=`<div class="field"><label>Type</label><select id="ot_cat">${OTHER_CATS.map(c=>`<option value="${c}" ${otherDraft.category===c?"selected":""}>${cap(c)}</option>`).join("")}</select></div>`;
  h+=`<div class="field"><label>Amount ₹</label><input id="ot_amt" type="number" inputmode="decimal" value="${esc(otherDraft.amount!=null?otherDraft.amount:"")}" placeholder="0"></div>`;
  h+=`<div class="field"><label>Note (optional)</label><input id="ot_note" value="${esc(otherDraft.notes||"")}" placeholder="e.g. courier to Delhi"></div>`;
  h+=`<div class="modal-actions"><button class="btn neutral" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOther()">${spendEditId?"Save":"Add expense"}</button></div>`;
  return h;
}
function otherSync(){ if($("#ot_date")) otherDraft.date=$("#ot_date").value; if($("#ot_cat")) otherDraft.category=$("#ot_cat").value; if($("#ot_amt")) otherDraft.amount=$("#ot_amt").value; if($("#ot_note")) otherDraft.notes=$("#ot_note").value; }
function saveOther(){
  otherSync();
  if(otherDraft.amount===""||otherDraft.amount==null){ toast("Please enter an amount"); return; }
  const rec=spendEditId?db.expenses.find(x=>x.id===spendEditId):{id:uid()};
  rec.date=otherDraft.date; rec.category=otherDraft.category; rec.amount=Number(otherDraft.amount)||0; rec.notes=otherDraft.notes;
  if(!spendEditId) db.expenses.push(rec);
  save(); closeModal(); toast(spendEditId?"Saved":"Expense added"); render();
}
function delPurchase(id){ if(!confirm("Delete this purchase? Stock will drop accordingly.")) return; db.purchases=db.purchases.filter(x=>x.id!==id); save(); toast("Deleted"); render(); }
function delOther(id){ if(!confirm("Delete this expense?")) return; db.expenses=db.expenses.filter(x=>x.id!==id); save(); toast("Deleted"); render(); }

/* ============ ORDERS ============ */
function vOrders(){
  const btn=`<button class="btn" onclick="openOrder()">＋ New order</button>`;
  let h=head("Orders","Yellow pending · green delivered · red cancelled",btn);
  const list=[...db.orders].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!list.length){ $("#view").innerHTML=h+emptyState("Add your first customer order.",`<button class="btn" onclick="openOrder()">＋ New order</button>`); return; }
  h+=`<div class="tiles">`;
  h+=list.map(o=>{
    const st=o.status;
    const cls= st==="completed"?"completed":(st==="cancelled"?"cancelled":"pending");
    const label= st==="completed"?"Delivered":(st==="cancelled"?"Cancelled":"Pending");
    const items=(o.items||[]).map(it=>esc(productName(it.productId))+"×"+it.qty).join(", ");
    return `<div class="tile ${cls}" onclick="openOrder('${o.id}')">
      <div class="st">${label}</div>
      <div class="cust">${esc(o.customer||"Customer")}</div>
      <div class="its">${items||"—"}</div>
      <div class="tot">${money(orderTotal(o))}</div>
      <div class="its">${fmtShort(o.date)}</div>
    </div>`;
  }).join("");
  h+=`</div>`;
  $("#view").innerHTML=h;
}
function delOrder(id){ if(!confirm("Delete this order?")) return; db.orders=db.orders.filter(x=>x.id!==id); save(); closeModal(); toast("Deleted"); render(); }

let ordDraft=null;
function openOrder(id){
  const o=id?db.orders.find(x=>x.id===id):null;
  ordDraft=o?structuredClone(o):{id:uid(),date:today(),customer:"",contact:"",items:[{productId:"",qty:1,price:""}],discountType:"none",discountValue:0,status:"pending"};
  if(!ordDraft.items||!ordDraft.items.length) ordDraft.items=[{productId:"",qty:1,price:""}];
  if(ordDraft.discountType==null){ ordDraft.discountType="none"; ordDraft.discountValue=0; }
  renderOrder(!!id);
}
function renderOrder(isEdit){
  let inner=`<h3>${isEdit?"Edit":"New"} order</h3>`;
  inner+=`<div class="field"><label>Date</label><input id="o_date" type="date" value="${esc(ordDraft.date)}"></div>`;
  inner+=`<div class="field two"><label>Customer</label>
    <input id="o_cust" value="${esc(ordDraft.customer||"")}" placeholder="Name">
    <input id="o_contact" value="${esc(ordDraft.contact||"")}" placeholder="Phone / @handle"></div>`;
  inner+=`<label style="font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block">Order items</label>`;
  inner+=`<div class="li-head"><span>Product</span><span>Qty</span><span>Price ₹</span><span></span></div>`;
  inner+=`<div id="o_items">`+ordDraft.items.map((it,i)=>oLine(it,i)).join("")+`</div>`;
  inner+=`<button class="btn ghost small" onclick="oAdd()" style="margin:2px 0 14px">＋ Add product</button>`;
  const dv=ordDraft.discountType==="percent"?String(ordDraft.discountValue):(ordDraft.discountType==="flat"?"custom":"none");
  inner+=`<div class="field"><label>Offer</label><select id="o_disc" onchange="oDiscSel()">
    <option value="none" ${dv==="none"?"selected":""}>No offer</option>
    <option value="5" ${dv==="5"?"selected":""}>5% off</option>
    <option value="10" ${dv==="10"?"selected":""}>10% off</option>
    <option value="20" ${dv==="20"?"selected":""}>20% off</option>
    <option value="custom" ${dv==="custom"?"selected":""}>Custom ₹ off</option>
  </select></div>`;
  inner+=`<div class="field" id="o_customwrap" style="display:${dv==="custom"?"block":"none"}"><label>Custom discount ₹</label><input id="o_custom" type="number" inputmode="decimal" value="${esc(ordDraft.discountType==="flat"?ordDraft.discountValue:"")}" onchange="oTotals()"></div>`;
  inner+=`<div class="kv" style="font-size:15px"><span>Subtotal</span><span class="amt" id="o_sub">${money(oSubtotal())}</span></div>`;
  inner+=`<div class="kv" style="font-size:15px"><span>Discount</span><span class="amt" id="o_discamt">−${money(oDiscount())}</span></div>`;
  inner+=`<div class="kv" style="font-size:17px"><span>Order total</span><span class="amt" id="o_tot">${money(oTotal())}</span></div>`;
  inner+=`<div class="field" style="margin-top:14px"><label>Status</label><select id="o_status">
    <option value="pending" ${ordDraft.status==="pending"?"selected":""}>Pending</option>
    <option value="completed" ${ordDraft.status==="completed"?"selected":""}>Delivered</option>
    <option value="cancelled" ${ordDraft.status==="cancelled"?"selected":""}>Cancelled</option>
  </select></div>`;
  inner+=`<div class="modal-actions" style="margin-top:6px">`;
  if(isEdit) inner+=`<button class="btn danger" onclick="delOrder('${ordDraft.id}')">Delete</button>`;
  inner+=`<button class="btn neutral" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOrder()">${isEdit?"Save order":"Add order"}</button></div>`;
  showModal(inner);
}
function oLine(it,i){
  const opts=`<option value="">Product…</option>`+db.products.map(p=>`<option value="${p.id}" ${it.productId===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
  return `<div class="lineitem">
    <select onchange="oChange(${i},'productId',this.value)">${opts}</select>
    <input type="number" inputmode="numeric" value="${esc(it.qty)}" onchange="oChange(${i},'qty',this.value)">
    <input type="number" inputmode="decimal" value="${esc(it.price)}" onchange="oChange(${i},'price',this.value)">
    <button class="rm" onclick="oRm(${i})">×</button></div>`;
}
function oSync(){
  if($("#o_date")) ordDraft.date=$("#o_date").value;
  if($("#o_cust")) ordDraft.customer=$("#o_cust").value;
  if($("#o_contact")) ordDraft.contact=$("#o_contact").value;
  if($("#o_status")) ordDraft.status=$("#o_status").value;
  oSyncDiscount();
}
function oSyncDiscount(){
  const sel=$("#o_disc"); if(!sel) return;
  if(sel.value==="none"){ ordDraft.discountType="none"; ordDraft.discountValue=0; }
  else if(sel.value==="custom"){ ordDraft.discountType="flat"; ordDraft.discountValue=$("#o_custom")&&$("#o_custom").value!==""?Number($("#o_custom").value):0; }
  else { ordDraft.discountType="percent"; ordDraft.discountValue=Number(sel.value); }
}
function oDiscSel(){ const sel=$("#o_disc"); $("#o_customwrap").style.display= sel.value==="custom"?"block":"none"; oTotals(); }
function oChange(i,k,val){
  if(k==="productId"){
    ordDraft.items[i].productId=val;
    const p=db.products.find(x=>x.id===val);
    if(p && (ordDraft.items[i].price===""||ordDraft.items[i].price==null)) ordDraft.items[i].price=p.price;
    oSync(); $("#o_items").innerHTML=ordDraft.items.map((it,idx)=>oLine(it,idx)).join("");
  } else ordDraft.items[i][k]= val===""?"":Number(val);
  oTotals();
}
function oAdd(){ oSync(); ordDraft.items.push({productId:"",qty:1,price:""}); $("#o_items").innerHTML=ordDraft.items.map((it,i)=>oLine(it,i)).join(""); }
function oRm(i){ oSync(); ordDraft.items.splice(i,1); if(!ordDraft.items.length) ordDraft.items.push({productId:"",qty:1,price:""}); renderOrder(!!db.orders.find(x=>x.id===ordDraft.id)); }
function oSubtotal(){ return (ordDraft.items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0); }
function oDiscount(){ oSyncDiscount(); const sub=oSubtotal(); if(ordDraft.discountType==="percent") return Math.round(sub*(Number(ordDraft.discountValue)||0)/100); if(ordDraft.discountType==="flat") return Number(ordDraft.discountValue)||0; return 0; }
function oTotal(){ return Math.max(0,oSubtotal()-oDiscount()); }
function oTotals(){
  oSyncDiscount();
  if($("#o_sub")) $("#o_sub").textContent=money(oSubtotal());
  if($("#o_discamt")) $("#o_discamt").textContent="−"+money(oDiscount());
  if($("#o_tot")) $("#o_tot").textContent=money(oTotal());
}
function saveOrder(){
  oSync();
  ordDraft.items=ordDraft.items.filter(it=>it.productId).map(it=>({productId:it.productId,qty:Number(it.qty)||0,price:it.price===""?0:Number(it.price)}));
  if(!ordDraft.items.length){ toast("Add at least one product"); return; }
  if(!ordDraft.customer) ordDraft.customer="Customer";
  if(ordDraft.status==="completed"){ if(!ordDraft.completedDate) ordDraft.completedDate=today(); } else { delete ordDraft.completedDate; }
  const existing=db.orders.find(x=>x.id===ordDraft.id);
  if(existing) Object.assign(existing,ordDraft); else db.orders.push(ordDraft);
  save(); closeModal(); toast(existing?"Order saved":"Order added"); render();
}

/* ============ LEDGER ============ */
function vLedger(){
  const t=totals();
  let h=head("Ledger","Money in and out, like a passbook");
  h+=`<div class="card"><div class="kv"><span>Balance</span><span class="amt ${t.balance>=0?'pos':'neg'}" style="font-size:20px">${money(t.balance)}</span></div></div>`;
  const rows=[];
  db.purchases.forEach(tr=>rows.push({date:tr.date,desc:"Stock purchase — "+((tr.items||[]).map(it=>productName(it.productId)+"×"+it.qty).join(", ")||"—"),out:purchaseAmount(tr)}));
  db.expenses.forEach(e=>rows.push({date:e.date,desc:(e.category?cap(e.category):"Expense")+(e.notes?" — "+e.notes:""),out:Number(e.amount)||0}));
  db.orders.forEach(o=>{ if(o.status==="completed") rows.push({date:o.completedDate||o.date,desc:"Order — "+(o.customer||"Customer"),in:orderTotal(o)}); });
  if(!rows.length){ $("#view").innerHTML=h+`<div class="empty"><div class="big">No entries yet</div><div>Purchases and completed orders will appear here.</div></div>`; return; }
  rows.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  h+=rows.map(r=>`<div class="ledgerrow"><div><div class="desc">${esc(r.desc)}</div><div class="date">${fmtDate(r.date)}</div></div>
    <div class="val ${r.in!=null?'pos':'neg'}">${r.in!=null?"+"+money(r.in):"−"+money(r.out)}</div></div>`).join("");
  $("#view").innerHTML=h;
}

    <div class="kv"><span>Products</span><span class="amt">${c("products")}</span></div>

  inner+=`<button class="btn neutral wide" onclick="$('#impf').click()" style="margin-bottom:10px">⬆︎ Restore from backup (replace)</button>`;
  inner+=`<button class="btn ghost wide" onclick="$('#impm').click()" style="margin-bottom:10px">＋ Add from a file (merge)</button>`;

  inner+=`<input type="file" id="impm" accept="application/json,.json" style="display:none" onchange="importJSON(event,true)">`;
  inner+=`<button class="btn ghost wide" onclick="exportCSV()" style="margin-bottom:10px">⬇︎ Export as CSV</button>`;
  inner+=`<div class="field two" style="margin-top:6px"><label>Low-stock alert at or below</label>
    <input type="number" id="lowset" value="${db.meta.lowStock}" inputmode="numeric">
    <button class="btn small" onclick="saveLow()">Save</button></div>`;
  inner+=`<details class="help"><summary>How to back up on iPad</summary><ol>
    <li>Tap Export backup.</li><li>Choose Save to Files → iCloud Drive.</li>
    <li>Weekly. To restore, tap Restore and pick the newest file.</li></ol></details>`;
  inner+=`<button class="btn danger wide" onclick="wipe()" style="margin-top:14px">Erase all data</button>`;
  inner+=`<div class="modal-actions" style="margin-top:12px"><button class="btn neutral" onclick="closeModal()">Close</button></div>`;
  showModal(inner);
}
function saveLow(){ const v=Number($("#lowset").value); if(!isNaN(v)){ db.meta.lowStock=v; save(); toast("Saved"); } }
function download(fn,text,type){ const b=new Blob([text],{type:type||"application/octet-stream"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},500); }
function exportJSON(){ const s=new Date().toISOString().slice(0,10); download(`backstitch-backup-${s}.json`,JSON.stringify(db,null,2),"application/json"); db.meta.lastBackup=Date.now(); save(); toast("Backup exported"); }
function importJSON(ev,merge){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=migrate(JSON.parse(r.result));
      if(merge){
        ["products","purchases","expenses","orders"].forEach(k=>{
          const have=new Set(db[k].map(x=>x.id));
          data[k].forEach(x=>{ if(!have.has(x.id)) db[k].push(x); });
        });
        save(); toast("Merged in");
      } else {
        if(!confirm("Replace ALL current data with this backup?")){ ev.target.value=""; return; }
        db=data; save(); toast("Backup restored");
      }
      closeModal(); render();
    }catch(e){ alert("That file doesn't look like a Backstitch backup."); }
    ev.target.value="";
  };
  r.readAsText(f);
}
function csvCell(v){ v=v==null?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function tableCSV(name,rows,cols){ return `# ${name}\n`+cols.join(",")+"\n"+rows.map(r=>cols.map(c=>csvCell(r[c])).join(",")).join("\n")+"\n\n"; }
function exportCSV(){
  let out="";
  out+=tableCSV("Products",db.products.map(p=>({name:p.name,category:p.category,buyingPrice:p.cost,sellingPrice:p.price,available:availableQty(p.id)})),["name","category","buyingPrice","sellingPrice","available"]);
  const pr=[]; db.purchases.forEach(t=>(t.items||[]).forEach(it=>pr.push({date:t.date,product:productName(it.productId),qty:it.qty,unitCost:it.unitCost,shipping:t.shipping})));
  out+=tableCSV("Purchases",pr,["date","product","qty","unitCost","shipping"]);
  out+=tableCSV("OtherExpenses",db.expenses.map(e=>({date:e.date,type:e.category,amount:e.amount,notes:e.notes})),["date","type","amount","notes"]);
  const orr=[]; db.orders.forEach(o=>(o.items||[]).forEach(it=>orr.push({date:o.date,customer:o.customer,contact:o.contact,product:productName(it.productId),qty:it.qty,price:it.price,status:o.status,orderTotal:orderTotal(o)})));
  out+=tableCSV("Orders",orr,["date","customer","contact","product","qty","price","status","orderTotal"]);
  const s=new Date().toISOString().slice(0,10); download(`backstitch-data-${s}.csv`,out,"text/csv"); toast("CSV exported");
}
function wipe(){ if(!confirm("Erase EVERYTHING? Export a backup first if unsure.")) return; if(!confirm("Absolutely sure? This cannot be undone.")) return; db=structuredClone(blank); save(); toast("All data erased"); closeModal(); go("home"); }

/* ============ MODAL + ACTION SHEET ============ */
function showModal(html){ $("#modal").innerHTML=html; $("#overlay").classList.add("show"); }
function closeModal(){ $("#overlay").classList.remove("show"); }
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
let _sheet=[];
function actionSheet(title,actions){
  _sheet=actions;
  let inner=`<h3>${esc(title)}</h3>`;
  inner+=actions.map((a,i)=>`<button class="btn ${a.danger?'danger':'neutral'} wide" style="margin-bottom:10px" onclick="runSheet(${i})">${esc(a.label)}</button>`).join("");
  inner+=`<button class="btn ghost wide" onclick="closeModal()">Cancel</button>`;
  showModal(inner);
}
function runSheet(i){ const a=_sheet[i]; closeModal(); if(a&&a.fn) setTimeout(a.fn,60); }

/* ============ ICON ============ */
function makeIcon(){
  try{
    const c=document.createElement("canvas"); c.width=c.height=180; const x=c.getContext("2d");
    x.fillStyle="#9B3B5E"; x.fillRect(0,0,180,180);
    x.strokeStyle="#FAF6EF"; x.lineWidth=11; x.lineCap="round";
    x.setLineDash([2,16]); x.beginPath(); x.moveTo(34,60); x.lineTo(70,90); x.lineTo(34,120); x.stroke();
    x.setLineDash([16,16]); x.beginPath(); x.moveTo(56,90); x.lineTo(150,90); x.stroke();
    x.setLineDash([]); x.fillStyle="#FAF6EF"; x.beginPath(); x.arc(132,90,22,0,7); x.fill();
    const u=c.toDataURL("image/png"); $("#appleicon").href=u; $("#favicon").href=u;
  }catch(e){}
}

/* ============ BOOT ============ */
makeIcon(); renderNav(); render();
</script>
